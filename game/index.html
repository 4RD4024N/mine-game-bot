<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mayın Tarlası</title>
<style>
  :root {
    --bg: #11161c; --panel: #1a222b; --gap: #0d1217;
    --covered: #5d6b7a; --covered-hi: #7d8c9c; --covered-lo: #3f4a56;
    --open: #252e38; --text: #d8dee6; --muted: #8a96a3; --accent: #e8b04a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; user-select: none; }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 22px; }
  header { display: flex; align-items: center; gap: 18px; }
  h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: .2px; }
  .levels { display: flex; gap: 6px; }
  .levels button, #reset {
    background: var(--panel); color: var(--text); border: 1px solid #2c3742; border-radius: 8px;
    padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .levels button.on { border-color: var(--accent); color: var(--accent); }
  .bar { display: flex; gap: 22px; align-items: center; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar b { color: var(--text); font-weight: 600; }
  #board {
    display: grid; gap: 2px; padding: 10px; background: var(--gap); border-radius: 10px;
    border: 1px solid #222c36;
  }
  .c {
    width: var(--cell); height: var(--cell); border-radius: 3px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: calc(var(--cell) * .58); line-height: 1;
    background: linear-gradient(145deg, var(--covered-hi) 0%, var(--covered) 45%, var(--covered-lo) 100%);
    box-shadow: inset 2px 2px 0 rgba(255,255,255,.18), inset -2px -2px 0 rgba(0,0,0,.28);
  }
  .c.o { background: var(--open); box-shadow: none; cursor: default; }
  .c.n1 { color: #4aa8ff; } .c.n2 { color: #4fc46b; } .c.n3 { color: #ff5a52; } .c.n4 { color: #b07cff; }
  .c.n5 { color: #ff9a3c; } .c.n6 { color: #36d6c8; } .c.n7 { color: #f2f2f2; } .c.n8 { color: #9aa4ae; }
  .c.f::after {   /* flag */
    content: ""; width: calc(var(--cell) * .42); height: calc(var(--cell) * .42);
    background: #ff3b3b; clip-path: polygon(15% 5%, 95% 32%, 15% 60%, 15% 100%, 5% 100%, 5% 5%);
  }
  .c.m { background: var(--open); box-shadow: none; }
  .c.m::after { content: ""; width: 46%; height: 46%; border-radius: 50%; background: #0a0a0a; box-shadow: 0 0 0 2px #e6e6e6; }
  .c.x { background: #b3261e; }
  #status { height: 20px; font-size: 15px; font-weight: 600; }
  #status.win { color: #4fc46b; } #status.lose { color: #ff5a52; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mayın Tarlası</h1>
    <div class="levels">
      <button data-l="kolay">Kolay</button><button data-l="orta">Orta</button><button data-l="zor">Zor</button>
    </div>
    <button id="reset">Yeni oyun</button>
  </header>
  <div class="bar"><span>Mayın <b id="left">0</b></span><span>Süre <b id="time">0</b> sn</span><span id="size"></span></div>
  <div id="board"></div>
  <div id="status"></div>
</div>
<script>
// Original minesweeper for the bot demo. The bot never reads this DOM: it only sees pixels.
const LEVELS = { kolay: [9, 9, 10], orta: [16, 16, 40], zor: [30, 16, 99] };
const params = new URLSearchParams(location.search);
let level = LEVELS[params.get('l')] ? params.get('l') : 'kolay';
let W, H, M, cells, mines, opened, flags, started, over, t0, timer;
const board = document.getElementById('board');
const idx = (x, y) => y * W + x;
const nbrs = (x, y) => { const r = []; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const nx = x + dx, ny = y + dy; if ((dx || dy) && nx >= 0 && ny >= 0 && nx < W && ny < H) r.push([nx, ny]); } return r; };

function setup() {
  [W, H, M] = LEVELS[level];
  const cell = Math.max(22, Math.min(32, Math.floor(Math.min((innerWidth - 80) / W, (innerHeight - 190) / H)) - 2));
  board.style.setProperty('--cell', cell + 'px');
  board.style.gridTemplateColumns = `repeat(${W}, var(--cell))`;
  board.innerHTML = '';
  cells = []; mines = new Set(); opened = 0; flags = 0; started = false; over = false;
  clearInterval(timer); document.getElementById('time').textContent = '0';
  document.getElementById('status').textContent = ''; document.getElementById('status').className = '';
  document.getElementById('size').textContent = `${W} × ${H}`;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const el = document.createElement('div'); el.className = 'c';
    el.addEventListener('mousedown', e => { if (e.button === 0) open(x, y); if (e.button === 2) flag(x, y); });
    el.addEventListener('contextmenu', e => e.preventDefault());
    board.appendChild(el); cells.push({ el, open: false, flag: false, n: 0 });
  }
  document.querySelectorAll('.levels button').forEach(b => b.classList.toggle('on', b.dataset.l === level));
  updateLeft();
}
function plant(sx, sy) {  // first click is always safe (and opens an area)
  const safe = new Set([idx(sx, sy), ...nbrs(sx, sy).map(([x, y]) => idx(x, y))]);
  while (mines.size < M) { const i = Math.floor(Math.random() * W * H); if (!safe.has(i)) mines.add(i); }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) cells[idx(x, y)].n = nbrs(x, y).filter(([a, b]) => mines.has(idx(a, b))).length;
  started = true; t0 = Date.now();
  timer = setInterval(() => document.getElementById('time').textContent = Math.floor((Date.now() - t0) / 1000), 250);
}
function open(x, y) {
  if (over) return; if (!started) plant(x, y);
  const c = cells[idx(x, y)]; if (c.open || c.flag) return;
  if (mines.has(idx(x, y))) return lose(idx(x, y));
  const stack = [[x, y]];
  while (stack.length) {
    const [cx, cy] = stack.pop(); const k = cells[idx(cx, cy)];
    if (k.open || k.flag) continue;
    k.open = true; opened++; k.el.className = 'c o' + (k.n ? ' n' + k.n : ''); k.el.textContent = k.n || '';
    if (k.n === 0) for (const p of nbrs(cx, cy)) stack.push(p);
  }
  if (opened === W * H - M) win();
}
function flag(x, y) {
  if (over) return; const c = cells[idx(x, y)]; if (c.open) return;
  c.flag = !c.flag; flags += c.flag ? 1 : -1; c.el.classList.toggle('f', c.flag); updateLeft();
}
function updateLeft() { document.getElementById('left').textContent = M - flags; }
function lose(hit) {
  over = true; clearInterval(timer);
  for (const i of mines) { const c = cells[i]; if (!c.flag) c.el.className = 'c m' + (i === hit ? ' x' : ''); }
  const s = document.getElementById('status'); s.textContent = 'Mayına basıldı'; s.className = 'lose';
}
function win() {
  over = true; clearInterval(timer);
  for (const i of mines) { const c = cells[i]; if (!c.flag) { c.flag = true; c.el.classList.add('f'); } }
  flags = M; updateLeft();
  const s = document.getElementById('status'); s.textContent = `Kazandın · ${((Date.now() - t0) / 1000).toFixed(1)} sn`; s.className = 'win';
}
document.querySelectorAll('.levels button').forEach(b => b.addEventListener('click', () => { level = b.dataset.l; history.replaceState(null, '', '?l=' + level); setup(); }));
document.getElementById('reset').addEventListener('click', setup);
setup();
</script>
</body>
</html>
